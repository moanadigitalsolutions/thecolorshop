{% extends 'base.html' %}
{% block title %}Check your inbox | The Color Shop{% endblock %}
{% block content %}
<div class="auth-panel mx-auto text-center">
  <span class="brand-mark mx-auto mb-3" aria-hidden="true"><i class="bi bi-envelope-check"></i></span>
  <p class="kicker mb-1">Password reset</p>
  <h1 class="h3 mb-2">Check your inbox</h1>
  <p class="text-secondary mb-3">If an account exists for that email address, we have sent a password reset link.</p>
  <p class="text-secondary small mb-0">You can safely return to the <a href="{% url 'login' %}">login page</a> while you wait.</p>
</div>
{% endblock %}
