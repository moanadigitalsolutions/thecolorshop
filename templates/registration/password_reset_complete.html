{% extends 'base.html' %}
{% block title %}Password updated | The Color Shop{% endblock %}
{% block content %}
<div class="auth-panel mx-auto text-center">
  <span class="brand-mark mx-auto mb-3" aria-hidden="true"><i class="bi bi-check2-circle"></i></span>
  <p class="kicker mb-1">Password reset</p>
  <h1 class="h3 mb-2">Password updated</h1>
  <p class="text-secondary mb-3">Your password has been changed. You can log in with your new credentials now.</p>
  <a class="btn btn-accent btn-lg" href="{% url 'login' %}">Go to login</a>
</div>
{% endblock %}
